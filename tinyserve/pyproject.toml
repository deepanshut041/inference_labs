[project]
name = "tinyserve"
version = "0.1.0"
description = "Learner-built inference engine: environment and workspace boilerplate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
tinyserve = "tinyserve.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyserve"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/.ai-project.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
